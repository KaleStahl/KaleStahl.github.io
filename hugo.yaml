baseurl: "https://kalestahl.github.io/"
languageCode: "en-us"
title: "Kale Stahl's Personal Website"
theme: "xmin"
googleAnalytics: ""
disqusShortname: ""
ignoreFiles: ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
footnotereturnlinkcontents: "↩"

permalinks:
  note: "/note/:year/:month/:day/:slug/"
  post: "/post/:year/:month/:day/:slug/"

menu:
  main:
    - name: Teaching
      url: "/teaching/"
      weight: 3
    - name: Ramblings
      url: "/pages/"
      weight: 5

markup:
  goldmark:
    renderer:
        hardWraps: false
        unsafe: true
        xhtml: false
    extensions:
      passthrough:
        delimiters:
          block:
          - - '\['
            - '\]'
          - - $$
            - $$
          inline:
          - - '\('
            - '\)'
        enable: true
  tableOfContents:
    endLevel: 6
    ordered: false
    startLevel: 1

params:
  math: true
  description: "A website built through Hugo."
  footer: "&copy; Kale Stahl 2024 -- {Year} | [Github](https://github.com/kalestahl)"