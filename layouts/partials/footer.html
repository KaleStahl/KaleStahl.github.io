  <footer>
  {{ partial "foot_custom.html" . }}
  {{ with .Site.Params.footer }}
  <hr/>
  {{ replace . "{Year}" now.Year | markdownify}}
  {{ end }}
  </footer>
  </body>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const toc = document.querySelector(".toc .toc-content");
      if (!toc) return;
    
      toc.querySelectorAll("li").forEach(li => {
        const subList = li.querySelector(":scope > ul");
        const link = li.querySelector(":scope > a");
    
        if (!link) return;
    
        // Only add toggle if it has children
        if (subList) {
          subList.classList.add("toc-submenu");
    
          // Create a single row container (arrow + text)
          const row = document.createElement("span");
          row.className = "toc-row";
    
          // Arrow
          const arrow = document.createElement("span");
          arrow.className = "toc-arrow";
          arrow.textContent = "▶";
    
          // Move link into row
          li.insertBefore(row, link);
          row.appendChild(arrow);
          row.appendChild(link);
    
          // Toggle behavior
          arrow.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
    
            const expanded = subList.classList.toggle("expanded");
            arrow.textContent = expanded ? "▼" : "▶";
          });
    
        } else {
          // Leaf nodes: no arrow, just ensure clean layout
          const row = document.createElement("span");
          row.className = "toc-row";
    
          li.insertBefore(row, link);
          row.appendChild(link);
        }
      });
    });
    </script>
</html>
